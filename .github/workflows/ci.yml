name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Syntax & Dependency Check
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Verify JavaScript syntax
      run: |
        node --check src/server.js
        node --check src/cli.js
        node --check src/utils/cookie-helper.js
        node --check src/utils/ai-helper.js
        node --check src/platforms/threads.js
        node --check src/platforms/twitter.js
        node --check src/platforms/facebook.js
        node --check src/platforms/facebook-page.js
        node --check src/platforms/linkedin.js
        node --check src/platforms/instagram.js
        node --check src/platforms/tiktok.js
        node --check src/platforms/youtube.js
